name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - name: Lint
        run: cd backend && ruff check .
      # The suite builds a synthetic dataset with a known treatment effect and runs the real
      # ingest -> SQL -> statistics -> uplift -> simulator -> API path on it. No download needed.
      - name: Unit, statistical and integration tests
        run: cd backend && pytest
      - name: Committed artifacts are valid and correctly labelled
        run: |
          cd backend && python - <<'PY'
          import json, pathlib
          root = pathlib.Path("../artifacts")
          for scope, is_sample in (("full", False), ("dev_sample", True)):
              for f in sorted((root / scope).glob("*.json")):
                  raw = f.read_text()
                  assert "NaN" not in raw and "Infinity" not in raw, f
                  meta = json.loads(raw)["meta"]
                  assert meta["scope"] == scope and meta["is_sample"] is is_sample, f
              full = json.loads((root / scope / "experiment.json").read_text())["meta"]
              assert (full["n_rows"] == 13_979_592) is (not is_sample)
          print("artifacts ok")
          PY

  frontend:
    name: Frontend build and end-to-end
    runs-on: ubuntu-latest
    env:
      CI: "true"
      EXPERIMENTOS_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e backend
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm typecheck && pnpm lint
      - run: cd frontend && API_URL=http://127.0.0.1:8765 pnpm build
      - run: cd frontend && pnpm exec playwright install --with-deps chromium
      # Runs the dashboard against the real API serving the committed (cached) artifacts.
      - run: cd frontend && pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
