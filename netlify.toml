# Netlify hosts the static build of the dashboard: cached analysis data plus in-browser calculators.
# No Python service is needed. Deploy from the CLI with the prebuilt site, or connect the repo for git deploys.
[build]
  base = "frontend"
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm build:static"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_DATA_MODE = "static"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # Next.js inlines its hydration payload and Recharts sets inline styles, hence 'unsafe-inline';
    # everything else is same-origin only, with no third-party scripts, fonts or trackers.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
