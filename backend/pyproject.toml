[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experimentos"
version = "0.1.0"
description = "Experimentation, causal inference and uplift analytics platform on the Criteo uplift dataset"
requires-python = ">=3.10"
dependencies = [
    "anyio>=4.14.2",  # security floor (PYSEC-2026-4024/4025)
    "duckdb>=1.0",
    "fastapi>=0.115",
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=23.0.1",  # security floor (PYSEC-2026-113)
    "pydantic>=2.5",
    "scikit-learn>=1.4",
    "python-dotenv>=1.2.2",  # transitive via uvicorn[standard]; security floor (PYSEC-2026-2270)
    "scipy>=1.11",
    "starlette>=1.3.1",  # security floor for FastAPI's web layer (PYSEC-2026-161/248/249/2280/2281)
    "statsmodels>=0.14",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "httpx>=0.27", "ruff>=0.17", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
include = ["experimentos*"]

[tool.setuptools.package-data]
experimentos = ["sql/views/*.sql", "sql/queries/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["real_data: needs the downloaded Criteo file (skipped when absent)"]
filterwarnings = ["ignore:.*encountered in matmul:RuntimeWarning"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP045", "B008"]
