[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experimentos"
version = "0.1.0"
description = "Experimentation, causal inference and uplift analytics platform on the Criteo uplift dataset"
requires-python = ">=3.9"
dependencies = [
    "duckdb>=1.0",
    "fastapi>=0.110",
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=15",
    "pydantic>=2.5",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["experimentos*"]

[tool.setuptools.package-data]
experimentos = ["sql/views/*.sql", "sql/queries/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["real_data: needs the downloaded Criteo file (skipped when absent)"]
filterwarnings = ["ignore:.*encountered in matmul:RuntimeWarning"]

[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP045", "B008"]
